<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-labelledby="title desc">
<title id="title">DPO pair selectors: mean reward and the Pareto-minus-gap effect</title>
<desc id="desc">Mean reward for the starting model and for three DPO training sets, with per-seed means, and the Pareto minus gap reward difference per seed with its bootstrap 95 percent interval.</desc>
<style>text{font-family:system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:14px;fill:#1f2933}.title{font-size:20px;font-weight:600}.sub{fill:#52606d}.small{font-size:12px}.axis{stroke:#9aa5b1;stroke-width:1}.grid{stroke:#e4e7eb;stroke-width:1}.bar{fill:#bcccdc}.hot{fill:#2f6f9f}.dot{fill:#102a43;stroke:#fff;stroke-width:1.5}.ci{stroke:#2f6f9f;stroke-width:4;stroke-linecap:round}.zero{stroke:#c0392b;stroke-width:1.5;stroke-dasharray:5 4}.red{fill:#c0392b}@media (prefers-color-scheme:dark){text{fill:#e4e7eb}.sub{fill:#9aa5b1}.axis{stroke:#616e7c}.grid{stroke:#323f4b}.bar{fill:#486581}.hot{fill:#6cb2eb}.dot{fill:#f0f4f8;stroke:#102a43}.ci{stroke:#6cb2eb}.zero{stroke:#ff8a80}.red{fill:#ff8a80}.bg{fill:#12181f}}.bg{fill:#fff}</style>
<rect class="bg" width="880" height="500"/>
<text class="title" x="24" y="34">DPO on 1,024 selected pairs: mean reward after training</text>
<text class="sub" x="24" y="58">Qwen2.5-1.5B-Instruct, 192 held-out prompts, 3 seeds per training set. Dots are seed means.</text>
<line class="grid" x1="190.0" x2="190.0" y1="82" y2="238"/>
<text class="small sub" x="190.0" y="256" text-anchor="middle">0</text>
<line class="grid" x1="342.5" x2="342.5" y1="82" y2="238"/>
<text class="small sub" x="342.5" y="256" text-anchor="middle">0.2</text>
<line class="grid" x1="495.0" x2="495.0" y1="82" y2="238"/>
<text class="small sub" x="495.0" y="256" text-anchor="middle">0.4</text>
<line class="grid" x1="647.5" x2="647.5" y1="82" y2="238"/>
<text class="small sub" x="647.5" y="256" text-anchor="middle">0.6</text>
<line class="grid" x1="800.0" x2="800.0" y1="82" y2="238"/>
<text class="small sub" x="800.0" y="256" text-anchor="middle">0.8</text>
<text class="small sub" x="190" y="274">mean reward (raw logit)</text>
<text x="178" y="110" text-anchor="end">Starting model</text>
<rect class="bar" x="190.0" y="92" width="419.5" height="26" rx="3"/>
<text x="623.5" y="110">0.55</text>
<text x="178" y="148" text-anchor="end">Pareto pairs</text>
<rect class="hot" x="190.0" y="130" width="472.6" height="26" rx="3"/>
<circle class="dot" cx="682.1" cy="143" r="4.5"/>
<circle class="dot" cx="653.8" cy="143" r="4.5"/>
<circle class="dot" cx="651.8" cy="143" r="4.5"/>
<text x="696.1" y="148">0.62</text>
<text x="178" y="186" text-anchor="end">Human-label pairs</text>
<rect class="bar" x="190.0" y="168" width="496.6" height="26" rx="3"/>
<circle class="dot" cx="716.9" cy="181" r="4.5"/>
<circle class="dot" cx="686.2" cy="181" r="4.5"/>
<circle class="dot" cx="656.7" cy="181" r="4.5"/>
<text x="730.9" y="186">0.65</text>
<text x="178" y="224" text-anchor="end">Helpfulness-gap pairs</text>
<rect class="bar" x="190.0" y="206" width="557.7" height="26" rx="3"/>
<circle class="dot" cx="702.8" cy="219" r="4.5"/>
<circle class="dot" cx="743.7" cy="219" r="4.5"/>
<circle class="dot" cx="796.6" cy="219" r="4.5"/>
<text x="810.6" y="224">0.73</text>
<line class="axis" x1="190.0" x2="190.0" y1="82" y2="238"/>
<text class="title" x="24" y="296" style="font-size:16px">Pareto minus gap, same prompts and seeds</text>
<line class="grid" x1="340.8" x2="340.8" y1="312" y2="416"/>
<text class="small sub" x="340.8" y="434" text-anchor="middle">-0.2</text>
<line class="grid" x1="517.0" x2="517.0" y1="312" y2="416"/>
<text class="small sub" x="517.0" y="434" text-anchor="middle">-0.1</text>
<line class="grid" x1="693.2" x2="693.2" y1="312" y2="416"/>
<text class="small sub" x="693.2" y="434" text-anchor="middle">0</text>
<line class="zero" x1="693.2" x2="693.2" y1="308" y2="418"/>
<text class="small red" x="699.2" y="322">no difference</text>
<text class="small" x="178" y="344" text-anchor="end">seed 1701</text>
<circle class="dot" cx="645.3" cy="340" r="4.5"/>
<text class="small" x="178" y="366" text-anchor="end">seed 1702</text>
<circle class="dot" cx="485.4" cy="362" r="4.5"/>
<text class="small" x="178" y="388" text-anchor="end">seed 1703</text>
<circle class="dot" cx="358.6" cy="384" r="4.5"/>
<text x="178" y="409" text-anchor="end">all seeds</text>
<line class="ci" x1="240.8" x2="749.2" y1="404" y2="404"/>
<circle class="dot" cx="496.5" cy="404" r="6"/>
<text x="24" y="470">-0.11 logits, 95% CI [-0.26, +0.03]: interval crosses zero: no clear winner.</text>
<text class="small sub" x="24" y="490">Reward: OpenAssistant DeBERTa-v3-large-v2. 10,000 bootstrap draws over prompts and seeds.</text>
</svg>
